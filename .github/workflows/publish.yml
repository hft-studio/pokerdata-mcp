# Publishes on a pushed v* tag (or a GitHub release, which creates one), or
# by hand from the Actions tab. A tag must match the version in the files.
#
# registry: lists the hosted server (https://pokerdata.io/api/mcp) in the
#   official MCP registry. Logs in with GitHub OIDC, so it needs no secret.
# npm: publishes the stdio bridge as `pokerdata-mcp` with npm trusted
#   publishing (GitHub OIDC), so it needs no token. It runs first because
#   the registry checks that the npm package it lists exists.
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  registry:
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Check server.json matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$(jq -r .version server.json)" = "${GITHUB_REF#refs/tags/v}"

      - name: Smoke-test the hosted server
        run: |
          printf '{"jsonrpc":"2.0","id":1,"method":"tools/list"}\n' \
            | node bin/pokerdata-mcp.js | jq -e '.result.tools | length > 0'

      - name: Wait for the npm version to appear
        run: |
          v=$(jq -r .version package.json)
          for i in $(seq 1 30); do
            curl -sf "https://registry.npmjs.org/pokerdata-mcp/$v" > /dev/null && exit 0
            sleep 10
          done
          echo "pokerdata-mcp@$v never appeared on npm"; exit 1

      - name: Publish to the MCP registry
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          # A version that is already listed is fine: npm may be what this run is for.
          if ! ./mcp-publisher publish > publish.log 2>&1; then
            cat publish.log
            grep -q "duplicate version" publish.log
          fi
          cat publish.log

  npm:
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing: npm trusts this workflow through GitHub OIDC.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest

      - name: Publish to npm
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$(jq -r .version package.json)" = "${GITHUB_REF#refs/tags/v}"
          fi
          v=$(jq -r .version package.json)
          if npm view "pokerdata-mcp@$v" version > /dev/null 2>&1; then
            echo "pokerdata-mcp@$v is already on npm"
          else
            npm publish --access public
          fi
